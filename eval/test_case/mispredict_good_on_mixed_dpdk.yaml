# mispredict_good_on_mixed_dpdk.yaml — Fig. mispredict: SSH DB/port 22 on mixed traffic (DPDK). Baseline = highrate_mixed_dpdk
test_name: mispredict_good_on_mixed_dpdk
pcap: mixed_output.pcap                 # file name on the slave (SLAVE_PCAP_DIR)
rules_file: build/mixed/filtered.rules   # rules Suricata loads (from sim/run_pipeline.sh)
acdb_file:  build/good/good.acdb             # blocklist DB for the XDP filter
suricata_conf: suricata/suricata-eval.yaml
filter_proto: 6
filter_port: 22
run_phases: [ac_filter]
allow_zero_acdrop: true   # port 22 never appears in mixed: the filter must drop nothing
test_mode: time
duration: 45
replay_pps: true      # rate = pps (pcap_replay -P)
replay_lcores: "0"   # single core: original packet order
rates:
  - {rep: 3, rate: 20000}
  - {rep: 3, rate: 40000}
  - {rep: 3, rate: 80000}
  - {rep: 3, rate: 120000}
  - {rep: 3, rate: 160000}
  - {rep: 3, rate: 200000}
  - {rep: 3, rate: 240000}
  - {rep: 3, rate: 280000}
  - {rep: 3, rate: 320000}
  - {rep: 3, rate: 350000}
  - {rep: 3, rate: 400000}
  - {rep: 3, rate: 450000}
  - {rep: 3, rate: 500000}
