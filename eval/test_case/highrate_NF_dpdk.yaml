# highrate_NF_dpdk.yaml — Fig. system loss (NF): DPDK replayer, 20-500 kpps, 3 reps
test_name: highrate_NF_dpdk
pcap: output_NF_2015_03.pcap                 # file name on the slave (SLAVE_PCAP_DIR)
rules_file: build/NF/filtered.rules   # rules Suricata loads (from sim/run_pipeline.sh)
acdb_file:  build/NF/NF.acdb             # blocklist DB for the XDP filter
suricata_conf: suricata/suricata-eval.yaml
filter_proto: 6
filter_port: 80
run_phases: [plain, ac_filter]
test_mode: time
duration: 45
replay_pps: true      # rate = pps (pcap_replay -P)
replay_lcores: "0"   # single core: original packet order
rates:
  - {rep: 3, rate: 20000}
  - {rep: 3, rate: 40000}
  - {rep: 3, rate: 80000}
  - {rep: 3, rate: 120000}
  - {rep: 3, rate: 160000}
  - {rep: 3, rate: 200000}
  - {rep: 3, rate: 240000}
  - {rep: 3, rate: 280000}
  - {rep: 3, rate: 320000}
  - {rep: 3, rate: 350000}
  - {rep: 3, rate: 400000}
  - {rep: 3, rate: 450000}
  - {rep: 3, rate: 500000}
